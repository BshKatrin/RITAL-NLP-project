[project]
name = "rital-nlp-project"
version = "0.1.0"
description = "Prediction model for RITAL NLP project on president and movie datasets."
readme = "../../README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastparquet>=2025.12.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "gensim>=4.4.0",
    "pyldavis>=3.4.1",
    "umap-learn>=0.5.11",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rital_nlp_project"]