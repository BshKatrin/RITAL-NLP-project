[project]
name = "rital-nlp-project-env-py314"
version = "0.1.0"
description = "Prediction model for RITAL NLP project on president and movie datasets"
readme = "../../README.md"
requires-python = ">=3.14"
dependencies = [
    "rital-nlp-project",
    "fastparquet>=2025.12.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "nbformat>=4.2.0",
    "nltk>=3.9.2",
    "numpy>=2.3.5",
    "pandas<3.0.0",
    "pip>=26.0.1",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "unidecode>=1.4.0",
    "wordcloud>=1.9.6",
    "torch==2.10.0+cu130; sys_platform != 'darwin'",
    "torch==2.10.0; sys_platform == 'darwin'",
    "transformers>=5.3.0",
    "datasets>=4.8.3",
    "accelerate>=1.1.0",
    "mlflow>=3.9.0",
    "protobuf>=3.12.0,<7",
    "sentencepiece>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rital_nlp_project"]

[tool.uv]
torch-backend = "cu130"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
rital-nlp-project = { path = "../..", editable = true }
torch = [
    { index = "pytorch", marker = "sys_platform != 'darwin'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]
