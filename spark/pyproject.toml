[project]
name = "torch-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastparquet>=2025.12.0",
  "ipykernel>=7.2.0",
  "numpy>=2.3.5",
  "pandas>=3.0.1",
  "torch>=2.10.0",
  "transformers>=5.3.0",
]

[tool.uv]
torch-backend = "cu130"

# Optional: custom source for PyTorch
extra-index-url = ["https://download.pytorch.org/whl/cu130"]

# Pin specific versions if needed
override-dependencies = [
    "torch",
    "torchvision",
    "torchaudio"
]
