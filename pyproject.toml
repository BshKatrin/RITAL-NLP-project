[project]
name = "rital-nlp-project"
version = "0.1.0"
description = "Prediction model for RITAL NLP project on president and movie datasets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastparquet>=2025.12.0",
    "gensim>=4.4.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "nbformat>=4.2.0",
    "nltk>=3.9.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pip>=26.0.1",
    "plotly>=6.6.0",
    "pyldavis>=3.4.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.11",
    "umap-learn>=0.5.11",
    "unidecode>=1.4.0",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["rital_nlp_project"]
package-dir = { "rital_nlp_project" = "src/rital_nlp_project" }
