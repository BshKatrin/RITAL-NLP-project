[project]
name = "rital-nlp-project"
version = "0.1.0"
description = "Prediction model for RITAL NLP project on president and movie datasets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "nltk>=3.9.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pip>=26.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.11",
    "unidecode>=1.4.0",
    "wordcloud>=1.9.6",
]
