[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rital-nlp-project"
version = "0.1.0"
description = "Prediction model for RITAL NLP project on president and movie datasets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "nltk>=3.9.2",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "unidecode>=1.4.0",
]

[project.optional-dependencies]
preprocess = [
    "spacy>=3.8.11",
]
embeddings = [
    "accelerate>=1.4.0",
    "sentencepiece>=0.2.1",
    "torch>=2.6.0",
    "transformers>=4.48.0",
]
visualization = [
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "wordcloud>=1.9.6",
]
word2vec = [
    "gensim>=4.4.0",
]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
rital-nlp = "rital_nlp_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
